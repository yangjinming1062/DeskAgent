[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-agent"
version = "0.2.0"
description = "DeskAgent Runner — stateless local tool executor for the DeskAgent companion"
requires-python = ">=3.11"
authors = [{ name = "DeskAgent" }]
license = "MIT"
dependencies = [
  "httpx[socks]==0.28.1",
  "pyyaml==6.0.3",
  "requests==2.33.0",
  "pydantic==2.13.4",
  "PyJWT[crypto]==2.12.1",
  "psutil==7.2.2",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
  "websockets==13.1",
  "Pillow==12.2.0",
  "mcp==1.27.0",
  "aiohttp==3.13.4",
  "faster-whisper>=1.0.3",
  "piper-tts>=1.2.0; python_version >= '3.10'",
  "pyttsx3>=2.90; sys_platform == 'win32' or sys_platform == 'darwin'",
  "sounddevice>=0.4.6",
  "numpy>=1.26.0",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "mss>=9.0.0; sys_platform == 'win32'",
  "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["debugpy==1.8.20", "pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-timeout==2.4.0", "ruff==0.15.10"]

[tool.setuptools.packages.find]
include = ["tools", "tools.*", "utils", "utils.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["PLW1514"]
