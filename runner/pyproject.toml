[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "spirit-agent"
version = "0.2.0"
description = "SpiritAgent Runner — stateless local tool executor for the SpiritAgent companion"
requires-python = ">=3.11"
authors = [{ name = "SpiritAgent" }]
license = "MIT"
dependencies = [
  "httpx[socks]==0.28.1",
  "pyyaml==6.0.3",
  "requests==2.33.0",
  "pydantic==2.13.4",
  "PyJWT[crypto]==2.12.1",
  "psutil==7.2.2",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
  "websockets==13.1",
  "Pillow==12.2.0",
  "mcp==1.27.0",
  "aiohttp==3.13.4",
  "faster-whisper>=1.0.3",
  "piper-tts>=1.2.0; python_version >= '3.10'",
  "pyttsx3>=2.90; sys_platform == 'win32' or sys_platform == 'darwin'",
  "sounddevice>=0.4.6",
  "numpy>=1.26.0",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "mss>=10.2.0; sys_platform == 'win32'",
  "pyautogui>=0.9.54; sys_platform == 'win32'",
  "pyperclip>=0.7.0",
]

[project.optional-dependencies]
dev = ["debugpy==1.8.20", "pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-timeout==2.4.0", "ruff==0.15.10"]

[tool.setuptools]
py-modules = ["runner_version"]

[tool.setuptools.packages.find]
include = ["tools", "tools.*", "utils", "utils.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
  "F",        # Pyflakes: unused imports, unused variables
  "E", "W",   # pycodestyle: syntax/formatting
  "I",        # isort: import sorting
  "UP",       # pyupgrade: modern Python 3.13 syntax & types
  "C4",       # flake8-comprehensions: generator & list comprehension optimizations
  "SIM",      # flake8-simplify: code & with-statement simplification
  "TID",      # flake8-tidy-imports: relative imports in package
  "ARG",      # flake8-unused-arguments
  "RUF",      # Ruff-specific rules (e.g. unused noqa)
  "PLW1514",  # unspecified encoding
]
ignore = [
  "E501",     # line too long (handled by ruff format)
  "E741",     # ambiguous variable name (e.g. l)
  "ARG",      # unused function/method/lambda arguments (common in agent tool contracts)
  "RUF",      # ruff-specific style rules
  "TID252",   # relative import from parent modules
  "UP042",    # StrEnum inheritance preference
  "F823",     # local variable referenced before assignment in legacy try-imports
  "SIM",      # simplify rules (preserve explicit control flow style)
]
