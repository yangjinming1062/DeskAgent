repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      # Run the linter first so ``--fix`` can rewrite imports before
      # ``ruff format`` re-flows the resulting layout. The order
      # matters: format-then-fix leaves import blocks split across
      # more lines than necessary.
      - id: ruff-check
        args:
          - --fix
          - --line-length=180
          - --target-version=py313
          - --select=E,F,I,SIM,C4,UP,FA,ARG,PLC,ERA,COM812,COM819
          - --ignore=PLC0415,ARG001,ARG002,E501
        exclude: ^(installer)/
      - id: ruff-format
        args: [ --line-length=180 ]
        exclude: ^(installer)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        types: [ file ]
        files: \.(json|myext)$
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: check-imports
        name: check backend+runner import shape (future annotations, TYPE_CHECKING leak, facade consistency)
        # --strict-imports makes the hook fail the commit on any violation;
        # without it, check_imports.py prints diagnostics and exits 0
        # (advisory mode).
        entry: python scripts/check_imports.py --strict-imports
        language: system
        types: [python]
        files: ^(backend|runner)/
      - id: check-forbidden-comments
        name: check forbidden issue tags in code comments
        entry: '(?i)#\s*.*(P[0-9]+-[0-9]+|M-[0-9]+)'
        language: pygrep
        types: [python, ts, tsx, javascript]
        exclude: ^(RULES\.md|AGENTS\.md|CHANGELOG.*|\.git.*)
      - id: client-eslint-fix
        name: client eslint fix
        entry: pnpm --dir client exec eslint renderer/ main/ --fix
        language: system
        files: ^client/(renderer|main)/.*\.(ts|tsx|js|cjs|mjs)$
        pass_filenames: false
      - id: client-fmt
        name: client prettier format
        entry: pnpm --dir client exec prettier --write "renderer/**/*.{ts,tsx}" "main/**/*.{ts,tsx}"
        language: system
        files: ^client/.*\.(ts|tsx|js|cjs|mjs|json|css)$
        pass_filenames: false
