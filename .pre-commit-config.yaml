repos:
  - repo: local
    hooks:
      - id: clean-trailing-commas
        name: remove unnecessary trailing commas (allows single-line collapse)
        entry: python scripts/clean_trailing_commas.py
        language: system
        types: [python]
        files: ^(backend|runner)/
        exclude: ^(runner/tests|backend/tests|installer)/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      # Run the linter first so ``--fix`` can rewrite imports before
      # ``ruff format`` re-flows the resulting layout. The order
      # matters: format-then-fix leaves import blocks split across
      # more lines than necessary.
      - id: ruff-check
        args:
          - --fix
          - --line-length=180
          - --target-version=py313
          - --select=E,F,I,SIM,C4,UP,FA,ARG,PLC,ERA
          - --ignore=PLC0415,ARG,E501,UP038,UP042,UP046,UP047,SIM,E741,F823,RUF012,RUF029,RUF036,TID252,ERA001,UP040,PLC
        # Match against the repo-root-relative path; ``runner/tests/`` and
        # ``backend/tests/`` and ``installer/`` should NOT be linted
        # (the test files have their own conventions; the installer
        # script lives outside the Python project).
        exclude: ^(runner/tests|backend/tests|installer)/
      - id: ruff-format
        args: [ --line-length=180 ]
        exclude: ^(runner/tests|backend/tests|installer)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        types: [ file ]
        files: \.(json|myext)$
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: check-imports
        name: check backend+runner import shape (TYPE_CHECKING leak, facade consistency)
        # --strict-imports makes the hook fail the commit on any violation;
        # without it, check_imports.py prints diagnostics and exits 0
        # (advisory mode).
        entry: python scripts/check_imports.py --strict-imports
        language: system
        types: [python]
        files: ^(backend|runner)/
      - id: check-forbidden-comments
        name: check forbidden issue tags in code comments
        entry: '(?i)#\s*.*(P[0-9]+-[0-9]+|M-[0-9]+)'
        language: pygrep
        types: [python, ts, tsx, javascript]
        exclude: ^(RULES\.md|AGENTS\.md|CHANGELOG.*|\.git.*)
      - id: client-eslint-fix
        name: client eslint fix
        entry: pnpm --dir client exec eslint renderer/ main/ --fix
        language: system
        files: ^client/(renderer|main)/.*\.(ts|tsx|js|cjs|mjs)$
        pass_filenames: false
      - id: client-fmt
        name: client prettier format
        entry: pnpm --dir client exec prettier --write "renderer/**/*.{ts,tsx}" "main/**/*.{ts,tsx}"
        language: system
        files: ^client/.*\.(ts|tsx|js|cjs|mjs|json|css)$
        pass_filenames: false
      - id: runner-startup-imports
        name: runner startup imports (pre-commit fast subset of the build_client gate)
        # Strict subset of the build_client.{ps1,sh} gate, which runs
        # the full `tests/` directory before `uv build --wheel`. This
        # hook only runs the 11 load-bearing import checks in <1s,
        # cheap enough for every commit. The build gate is the
        # authoritative safety net — this hook exists so a stale env
        # surfaces before push rather than only at release time.
        # `pass_filenames: false` keeps pre-commit from appending the
        # staged file paths as extra positional args; the entry is a
        # fixed pytest invocation (the `files:` filter only decides
        # *when* to fire, not *what* it sees).
        entry: uv run --directory runner --frozen --extra dev pytest tests/test_startup_imports.py -q
        language: system
        files: ^runner/(.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
        require_serial: true
