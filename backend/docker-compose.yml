services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spiritagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spiritagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: backend
    container_name: spiritagent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "10620:10620"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./updates:/app/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10620/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Render worker: same image as backend + docker-cli. Owns the Blender/LLM
  # pipelines so the web process stays responsive. docker.sock is required
  # for sandboxed bpy execution — that mount is effectively host root, keep
  # it out of anything multi-tenant (ARCHITECTURE.md §10).
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    container_name: spiritagent-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BLENDER_SANDBOX_ENABLED: "true"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  # Build-only Blender sandbox image (--profile build); the worker references
  # it by name via [blender_sandbox] image.
  blender-sandbox:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: sandbox
    image: spiritagent-blender-sandbox:latest
    profiles:
      - build
    command: ["true"]

  # Optional Prometheus metrics observability platform (--profile monitoring)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spiritagent-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
