[project]
name = "deskagent-backend"
version = "0.1.0"
description = "DeskAgent Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.51",
    "PyJWT>=2.13.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "python-multipart",
    "openai>=2.53.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "ddgs>=9.0.0",
    "croniter>=6.2.4",
    "psycopg[binary]>=3.3.4",
    "asyncpg>=0.31.0",
    "slowapi==0.1.10",
    "Pillow>=10.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
markers = [
    "e2e: tests that call real LLM API (requires MIMO_API_KEY env var)",
]
