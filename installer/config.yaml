# DeskAgent Runner 默认配置文件
# 此文件在安装时释放到 ~/.deskagent/config.yaml
# 所有配置项都可通过 Desktop 设置页面修改

# =============================================================================
# 终端配置
# =============================================================================
terminal:
  # 终端环境类型: local / docker / ssh / singularity
  env_type: local

  # 默认超时时间（秒）
  timeout: 180

  # 默认工作目录（留空使用当前目录）
  cwd: ""

  # 时区（留空使用系统时区）
  timezone: ""

  # Sudo 密码（留空表示无密码或交互式输入）
  sudo_password: ""

  # 是否启用交互式 sudo 密码提示
  interactive_sudo_prompt: false

  # Docker 二进制路径（留空自动检测）
  docker_binary: ""

  # Git Bash 路径（仅 Windows，留空自动检测）
  git_bash_path: ""

  # 沙箱目录（留空使用默认 ~/.deskagent/sandboxes）
  sandbox_dir: ""

  # Shell 初始化文件列表（留空使用默认）
  shell_init_files: []

  # 是否自动 source .bashrc
  auto_source_bashrc: true

  # 需要传递到子进程的环境变量
  env_passthrough: []

  # 需要挂载到容器的凭据文件
  credential_files: []

  # Singularity 配置
  singularity:
    # 自定义 scratch 目录（留空使用默认）
    scratch_dir: ""

# =============================================================================
# 安全配置
# =============================================================================
security:
  # 写入安全根目录（留空不限制）
  write_safe_root: ""

  # 是否启用敏感信息脱敏
  redact_secrets: true

  # GitHub Token（用于 tirith 安全检查）
  github_token: ""

# =============================================================================
# 浏览器配置
# =============================================================================
browser:
  # 浏览器引擎: auto / lightpanda / chrome
  engine: auto

  # 命令超时时间（秒）
  command_timeout: 30

  # 会话无活动超时时间（秒）
  inactivity_timeout_seconds: 300

  # 是否录制浏览器会话
  record_sessions: false

  # 是否允许访问私有 URL
  allow_private_urls: false

  # 浏览器可执行文件路径（留空自动检测）
  executable_path: ""

  # Playwright 浏览器路径（留空使用默认）
  playwright_browsers_path: ""

  # CDP URL（留空使用本地）
  cdp_url: ""

  # Camofox 配置
  camofox:
    # Camofox 服务 URL（留空禁用）
    url: ""

# =============================================================================
# 辅助工具配置
# =============================================================================
auxiliary:
  # 视觉分析配置
  vision:
    # 视觉模型推理超时时间（秒）
    timeout: 120
    # 视觉模型推理温度
    temperature: 0.1
    # 下载超时时间（秒）
    download_timeout: 30

# =============================================================================
# 技能配置
# =============================================================================
skills:
  # GitHub 配置（用于技能市场）
  github:
    # GitHub Personal Access Token
    token: ""

    # GitHub App 配置（可选）
    app_id: ""
    private_key_path: ""
    installation_id: ""

  # 禁用的技能列表。
  # 安装时整段 cp -f 覆盖到 $DESKAGENT_HOME/config.yaml —— 用户在桌面端切换后,
  # reinstall 会重置回本默认(repair 同理)。填入 leaf 技能名而非 category 名:
  # Runner `_is_disabled` 匹配粒度为 name OR category,category 条目会一并禁用
  # 该目录下的 bundled(always-on)技能。基础版本默认全部启用,以下 5 项需要外部
  # CLI 或认证,需要用户从桌面端按需开启:
  # - claude-code: 需要安装 Claude Code CLI (npm i -g @anthropic-ai/claude-code) + OAuth
  # - codex: 需要安装 Codex CLI (npm i -g @openai/codex) + OAuth
  # - fastmcp: 需要安装 FastMCP 库
  # - mcporter: 需要安装 mcporter CLI
  # - parallel-cli: 需要安装 parallel-cli 工具
  disabled:
    - claude-code
    - codex
    - fastmcp
    - mcporter
    - parallel-cli

  # 技能环境变量覆盖
  env_overrides: {}

  # 外部技能目录
  external_dirs: []

  # 是否对 agent 创建的技能进行安全扫描
  guard_agent_created: false

# =============================================================================
# MCP 服务器配置
# =============================================================================
mcp_servers: {}
  # 示例:
  # my-server:
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/dir"]
  #   env:
  #     NODE_ENV: production

# =============================================================================
# 调试配置
# =============================================================================
debug:
  # 调试中断模式
  interrupt: false

  # 视觉工具调试
  vision_tools: true

# =============================================================================
# 文件状态配置
# =============================================================================
file_state:
  # 是否禁用跨 agent 文件状态跟踪
  disabled: false

# =============================================================================
# 计算机使用配置
# =============================================================================
computer_use:
  # 后端: auto (按平台选择), cua (macOS), win (Windows), noop (测试)
  backend: auto

  # CUA 驱动版本
  cua_driver_version: "0.5.0"

  # CUA 驱动命令
  cua_driver_cmd: cua-driver

  # cua-driver 的 PostHog 遥测开关。默认关闭——cu-driver 默认会上报匿名使用
  # 数据,产品视角是默认 opt-out,显式设 true 才启用。Runner 在启动 cua-driver
  # 子进程时根据这个值注入 CUA_DRIVER_RS_TELEMETRY_ENABLED。
  cua_telemetry: false

# =============================================================================
# OSV 配置
# =============================================================================
osv:
  # OSV API 端点
  endpoint: "https://api.osv.dev/v1/query"

# =============================================================================
# 工具输出限制
# =============================================================================
tool_output:
  # 最大输出字节数
  max_bytes: 102400

  # 最大行数
  max_lines: 2000

  # 最大行长度
  max_line_length: 2000

# =============================================================================
# 配置文件版本
# =============================================================================
_version: 1
